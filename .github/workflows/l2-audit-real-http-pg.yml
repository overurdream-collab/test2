name: L2 real shared audit integration PG16 (disposable composition)
on:
  pull_request:
    paths:
      - 'mcias/app.py'
      - 'mcias/auth.py'
      - 'mcias/tenant.py'
      - 'mcias/denial_events.py'
      - 'tests/test_l2_audit_real_http_pg.py'
      - '.github/workflows/l2-audit-real-http-pg.yml'
  workflow_dispatch:
jobs:
  isolated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcias_l2_e2e
          POSTGRES_PASSWORD: l2-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcias_l2_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MCIAS_ENVIRONMENT: development
      MCIAS_L2_ALLOW_ISOLATED_TESTS: "YES"
      MCIAS_L2_ISOLATED_DATABASE_URL: postgresql+psycopg://postgres:l2-synthetic-ci-only@127.0.0.1:5432/mcias_l2_e2e
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:l2-synthetic-ci-only@127.0.0.1:5432/mcias_l2_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Temporarily overlay approved PR25 writer ONLY in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test ! -e mcias/audit_writer.py
          git fetch --no-tags --depth=1 origin 60f1db7d174e9d1a29921ed578392ed5705b2874
          git show 60f1db7d174e9d1a29921ed578392ed5705b2874:mcias/audit_writer.py > mcias/audit_writer.py
          echo "PR25 writer blob sha:" 
          git hash-object mcias/audit_writer.py
          test "$(git hash-object mcias/audit_writer.py)" = 509ce4124f012cc4a121294fe9122c9384902fd6
          test "$(git status --porcelain mcias/audit_writer.py | cut -c1-2)" = "??"
      - name: Migrate ONLY disposable local PostgreSQL
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          p=urlsplit(os.environ["MCIAS_TEST_DATABASE_URL"])
          assert p.hostname == "127.0.0.1" and p.path == "/mcias_l2_e2e"
          PY
          alembic upgrade head
      - name: Seed synthetic actor
        run: python scripts/l2_sec001_seed.py
      - name: HTTP and PostgreSQL real writer integration
        run: pytest -q tests/test_l2_audit_real_http_pg.py
