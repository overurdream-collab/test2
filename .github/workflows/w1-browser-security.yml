name: W1 isolated Chromium and PostgreSQL verification
on:
  push:
    branches: [feat/mcias-w1-windows-ui-reuse-pilot]
    paths:
      - '.github/workflows/w1-browser-security.yml'
      - 'mcias/web_workspace/**'
      - 'scripts/check_workspace_browser.py'
      - 'scripts/check_workspace_live.py'
      - 'tests/test_enterprise_workspace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w1-browser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcias_ci
          POSTGRES_PASSWORD: synthetic_ci_password_only
          POSTGRES_DB: mcias_ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcias_ci -d mcias_ci_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MCIAS_DATABASE_URL: postgresql+psycopg://mcias_ci:synthetic_ci_password_only@localhost:5432/mcias_ci_e2e
      MCIAS_E2E_DATABASE_URL: postgresql+psycopg://mcias_ci:synthetic_ci_password_only@localhost:5432/mcias_ci_e2e
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://mcias_ci:synthetic_ci_password_only@localhost:5432/mcias_ci_e2e
      MCIAS_BOOTSTRAP_TOKEN: synthetic_browser_tests_only
      MCIAS_ENABLE_UI_DEMO: 'true'
      MCIAS_ENVIRONMENT: development
      MCIAS_STORAGE_DIR: .e2e-output/integrated-sources
      MCIAS_STORAGE_KEY: '1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a'
      MCIAS_MFA_ENCRYPTION_KEY: '2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing browser test dependencies
        run: |
          python -m pip install -e '.[test,browser]'
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts
      - name: Existing server authorization and tenant isolation tests
        run: python -m pytest tests/test_enterprise_workspace.py -q
      - name: Prepare isolated synthetic PostgreSQL fixture
        run: python scripts/seed_workspace_e2e.py
      - name: Existing Chromium and live PostgreSQL browser tests
        run: |
          set -e
          python -m uvicorn mcias.app:app --host 127.0.0.1 --port 8000 > /tmp/mcias-w1-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/live
          python scripts/check_workspace_browser.py
          python scripts/check_workspace_live.py --base-url http://127.0.0.1:8000
      - name: Preserve synthetic visual and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-chromium-postgres-evidence
          include-hidden-files: true
          path: |
            .e2e-output/*results.json
            .e2e-output/w1-role-matrix.json
            .e2e-output/*.png
            /tmp/mcias-w1-server.log
