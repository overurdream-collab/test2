name: Contract AI C34 recall diagnostic (isolated)
on:
  pull_request:
    branches: [feat/temporal-reference-inputs-and-four-outcomes]
    paths:
      - 'mcias/contract_intelligence.py'
      - 'scripts/contract_ai_benchmark.py'
      - 'scripts/contract_tariff_segments.py'
      - 'tests/test_contract_c34_rejection_replay.py'
      - 'tests/fixtures/contract_c34_holdout_synthetic.json'
      - '.github/workflows/contract-ai-c34.yml'
  push:
    branches: [feat/mcias-contract-intelligence]
    paths:
      - 'mcias/contract_intelligence.py'
      - 'scripts/contract_ai_benchmark.py'
      - 'scripts/contract_tariff_segments.py'
      - 'tests/test_contract_c34_rejection_replay.py'
      - 'tests/fixtures/contract_c34_holdout_synthetic.json'
      - '.github/workflows/contract-ai-c34.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c34-source-literal-qwen-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [frozen-c33, holdout-c34]
        include:
          - sample: frozen-c33
            corpus: tests/fixtures/contract_independent_synthetic.json
          - sample: holdout-c34
            corpus: tests/fixtures/contract_c34_holdout_synthetic.json
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_OFFLINE: '0'
      MCIAS_ENVIRONMENT: development
      OMP_NUM_THREADS: '2'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real model and isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.7.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.1" "accelerate==1.11.0" "huggingface_hub>=0.35,<1" "safetensors>=0.6,<0.8" "lm-format-enforcer==0.11.2" "pytest==8.4.2"
          python -m pip install -e .
      - name: Replay C33 raw rejects and validate holdout source anchors
        run: python -m pytest -q tests/test_contract_c34_rejection_replay.py tests/test_contract_tariff_segments.py tests/test_contract_independent_synthetic.py
      - name: Real pinned Qwen2.5 candidate inference with unchanged independent Validator
        run: |
          python scripts/contract_ai_benchmark.py --split-multi-tariff --diagnostic-tariff-literals --cases-file "${{ matrix.corpus }}" --output "/tmp/mcias-c34-${{ matrix.sample }}.json"
      - name: Preserve real output and rejection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcias-c34-${{ matrix.sample }}-evidence
          path: /tmp/mcias-c34-${{ matrix.sample }}.json
          retention-days: 7
          if-no-files-found: warn
