name: L2 denial transaction PostgreSQL 16 (mandatory)
on:
  pull_request:
    paths:
      - 'mcias/auth.py'
      - 'mcias/tenant.py'
      - 'mcias/denial_events.py'
      - 'mcias/app.py'
      - 'tests/test_l2_denial_transaction_regression.py'
      - 'scripts/l2_sec001_seed.py'
      - '.github/workflows/l2-denial-transaction-postgres.yml'
  workflow_dispatch:
jobs:
  l2-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: l2-synthetic-ci-only
          POSTGRES_DB: mcias_l2_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcias_l2_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MCIAS_ENVIRONMENT: development
      MCIAS_L2_ALLOW_ISOLATED_TESTS: "YES"
      MCIAS_L2_ISOLATED_DATABASE_URL: postgresql+psycopg://postgres:l2-synthetic-ci-only@127.0.0.1:5432/mcias_l2_e2e
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:l2-synthetic-ci-only@127.0.0.1:5432/mcias_l2_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify isolated migration target
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          u=urlsplit(os.environ["MCIAS_TEST_DATABASE_URL"])
          assert u.hostname=="127.0.0.1" and u.path=="/mcias_l2_e2e"
          PY
      - name: Migrate isolated synthetic database only
        run: alembic upgrade head
      - name: Provision synthetic actor and tenant
        run: python scripts/l2_sec001_seed.py
      - name: L2 security gate — original guards
        run: pytest -q tests/test_l2_denial_transaction_regression.py
