name: Shared Audit Semantic Match Classification
on:
  pull_request:
    paths:
      - scripts/classify_shared_audit_matches.py
      - .github/workflows/shared-audit-semantic-classification.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-audit-consumer-inventory
          run-id: 39330289038
          github-token: ${{ github.token }}
          path: original-inventory
      - name: Verify previous artifact and classify each match
        run: |
          test -s original-inventory/files.csv
          test -s original-inventory/matches.csv
          test -s original-inventory/summary.json
          test -s original-inventory/SUMMARY.md
          python scripts/classify_shared_audit_matches.py original-inventory/matches.csv classified_matches.csv
      - uses: actions/upload-artifact@v4
        with:
          name: shared-audit-semantic-classification
          path: classified_matches.csv
          if-no-files-found: error
