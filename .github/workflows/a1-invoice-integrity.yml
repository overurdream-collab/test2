name: A1 InvoiceIntegrity model qualification

on:
  pull_request:
    paths:
      - "mcias/agents/**"
      - "tests/a1/**"
      - "tests/test_a1*.py"
      - "scripts/*a1*.py"
      - ".github/workflows/a1-invoice-integrity.yml"
  workflow_dispatch:

concurrency:
  group: a1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing MCIAS test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run A1 safety, precision, and evidence tests
        run: python -m pytest tests/test_a1*.py -q
      - name: Evaluate hand-labeled synthetic cases
        run: python -m scripts.evaluate_a1 --output a1-results.json
      - name: Compare A1 and existing G5 Decimal engine on compatible synthetic claims
        run: python -m scripts.compare_a1_g5_baseline --output a1-g5-comparison.json
      - name: Save real measurements as test artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-deterministic-metrics
          path: |
            a1-results.json
            a1-g5-comparison.json
          if-no-files-found: ignore

  open-weight-inference:
    # Model qualification is explicit; adapter-only PRs keep deterministic checks.
    if: github.event_name == 'workflow_dispatch'
    needs: synthetic-rules
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated free local model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python>=0.3.9,<1" "huggingface_hub>=0.30,<2"
      - name: Real Qwen3-8B CPU inference and independent ten-case accuracy
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m scripts.a1_probe_local_model --download-public-model --repo Qwen/Qwen3-8B-GGUF --output a1-real-model-evidence.json
      - name: Preserve inference transcript and model fingerprint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-real-model-inference
          path: a1-real-model-evidence.json
          if-no-files-found: ignore
