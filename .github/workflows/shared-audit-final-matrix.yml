name: Shared Audit Final Consumer Matrix
on:
  pull_request:
    paths:
      - scripts/finalize_consumer_matrix_21.py
      - .github/workflows/shared-audit-final-matrix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcias-shared-audit-writer-phase1
          fetch-depth: 1
      - name: Finalize source-traced 21 matrix rows
        run: python scripts/finalize_consumer_matrix_21.py
      - uses: actions/upload-artifact@v4
        with:
          name: shared-audit-final-consumer-matrix
          path: |
            docs/shared_audit_semantic_evidence/audit_consumer_matrix.csv
            docs/shared_audit_semantic_evidence/semantic_closure_summary.json
      - name: Save evidence only in PR29
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shared_audit_semantic_evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(audit): source-trace and close matrix placeholders"
          git push origin HEAD:refs/heads/feat/mcias-shared-audit-writer-phase1
