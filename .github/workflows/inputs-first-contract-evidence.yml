name: INPUTS-FIRST contract evidence
on:
  pull_request:
    paths:
      - 'mcias/contract_source_view.py'
      - 'tests/test_contract_source_view.py'
      - '.github/workflows/inputs-first-contract-evidence.yml'
permissions:
  contents: read
jobs:
  source-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_contract_source_view.py tests/test_contract_intelligence.py tests/test_contract_intelligence_api.py tests/test_contract_tariff_segments.py tests/test_contract_independent_synthetic.py
