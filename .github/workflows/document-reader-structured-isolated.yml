name: MCIAS Reader Structured Isolated Checks
on:
  push:
    branches: [feat/mcias-document-reader-isolated-pilot]
    paths:
      - scripts/document_reader_structured_pilot.py
      - scripts/document_reader_a1_bridge_pilot.py
      - scripts/document_reader_offline_ocr_benchmark.py
      - .github/workflows/document-reader-structured-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-structured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated synthetic structured field verification
        run: python scripts/document_reader_structured_pilot.py reader-pilot-structured-results
      - name: Enforce negative case evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reader-pilot-structured-results/structured_results.json").read_text())
          by={x["id"]:x for x in d["results"]}
          assert len(by)==8
          assert "AMOUNT_MISMATCH" in " ".join(by["invoice_swap"]["result"]["issues"])
          assert by["malformed"]["result"]["status"]=="HUMAN_REVIEW"
          assert by["malicious_instruction"]["result"]["status"]=="SUPPORTED"
          assert by["multi_page"]["result"]["records"][1]["name"]["page"]==2
          assert by["lab_value_vs_range"]["result"]["records"][0]["result"]["value"]=="13.5"
          assert by["lab_value_vs_range"]["result"]["records"][0]["range"]["value"]=="12.0-16.0"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-structured-synthetic-evidence
          path: reader-pilot-structured-results/
          retention-days: 30

  pinned-a1-read-only-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b536a94adf4d190ac48856bd435a8a624f3931f4
          path: pinned-a1-readonly
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned A1 and run synthetic bridge
        run: |
          test "$(git -C pinned-a1-readonly rev-parse HEAD)" = "b536a94adf4d190ac48856bd435a8a624f3931f4"
          python scripts/document_reader_a1_bridge_pilot.py pinned-a1-readonly/mcias/agents/invoice_integrity.py reader-a1-results
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("reader-a1-results/reader_a1_bridge_results.json").read_text())
          assert len(data["cases"])==4
          assert all(x["financial_decision"]=="NOT_AUTHORIZED" for x in data["cases"])
          assert all(x["integration_status"]=="HUMAN_REVIEW" for x in data["cases"])
          assert all(x["source_attestation"]=="NOT_ATTESTED_FIXTURE_TEXT_ONLY" for x in data["cases"])
          assert [x["a1_arithmetic_count"] for x in data["cases"]]==[0,1,2,0]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-to-a1-synthetic-bridge
          path: reader-a1-results/
          retention-days: 30

  local-tesseract-arabic-english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source local OCR and language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng fonts-dejavu-core
          python -m pip install 'Pillow>=11,<13'
      - name: Run measured synthetic Arabic and English OCR
        run: |
          PYTHONPATH=. python scripts/document_reader_offline_ocr_benchmark.py reader-ocr-results
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("reader-ocr-results/offline_ocr_baseline.json").read_text())
          assert len(obj["measurements"])==12
          assert {r["language"] for r in obj["measurements"]}=={"ara","eng"}
          assert all(r["error"] is None and r["seconds"]>=0 for r in obj["measurements"])
          assert all(r["normalized_cer"]>=0 for r in obj["measurements"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-local-ocr-synthetic
          path: reader-ocr-results/
          retention-days: 30
