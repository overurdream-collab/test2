name: INPUTS-FIRST owner contracts PG16
on:
  pull_request:
    paths:
      - 'mcias/**'
      - 'tests/**'
      - '.github/workflows/inputs-first-pg16.yml'
permissions:
  contents: read
jobs:
  source-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: mcias_inputs_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mcias_inputs_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-only@127.0.0.1:5432/mcias_inputs_e2e
      MCIAS_G3_REFERENCE_DATABASE_URL: postgresql+psycopg://postgres:synthetic-only@127.0.0.1:5432/mcias_inputs_g3
      MCIAS_INPUTS_AUDIT_DATABASE_URL: postgresql+psycopg://postgres:synthetic-only@127.0.0.1:5432/mcias_inputs_audit
      MCIAS_INPUTS_AUDIT_ALLOW: 'YES'
      MCIAS_ENVIRONMENT: development
      MCIAS_MALWARE_SCAN: disabled
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Prepare only disposable fixture databases
        run: |
          psql -h 127.0.0.1 -U postgres -d mcias_inputs_e2e -c 'CREATE DATABASE mcias_inputs_g3'
          psql -h 127.0.0.1 -U postgres -d mcias_inputs_e2e -c 'CREATE DATABASE mcias_inputs_audit'
      - name: Real committed source, dated references, G5 and Shared Audit
        run: >-
          python -m pytest -q
          tests/test_e1_real_g2_g4_pg16.py tests/test_g4_approved_source_scope.py
          tests/test_g3_inputs_first_certificates.py tests/test_g3_reference.py
          tests/test_g3_lifecycle.py tests/test_g3_signed_authorization.py
          tests/test_g5_inputs_first.py tests/test_g5_agent_order.py
          tests/test_shared_audit_inputs_pg16.py tests/test_operational_controls.py
