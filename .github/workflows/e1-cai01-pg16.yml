name: E1 CAI-01 isolated G2-G4 PG16 diagnostic
on:
  pull_request:
    paths:
      - 'tests/test_e1_real_g2_g4_pg16.py'
      - '.github/workflows/e1-cai01-pg16.yml'
jobs:
  e1-g2-g4-pg16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcias_ci
          POSTGRES_PASSWORD: ci_only_not_for_production
          POSTGRES_DB: mcias_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcias_ci -d mcias_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://mcias_ci:ci_only_not_for_production@localhost:5432/mcias_ci
      MCIAS_ENVIRONMENT: development
      MCIAS_MALWARE_SCAN: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v -rs tests/test_e1_real_g2_g4_pg16.py
