# DG-001: Contracts-only strict acceptance gate. No production deployment.
# This job is intentionally RED until real browser -> G2 -> human preview -> PostgreSQL
# create/revision and RBAC are all proven. Artifacts are written even on FAIL.
name: Contracts acceptance (strict)
on:
  push:
    branches: [feat/mcias-input-triactions-e2e]
  workflow_dispatch:
  pull_request:
    branches: [feat/mcias-temporal-inputs-triage-ui]
jobs:
  contracts-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcias
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: mcias_contracts_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcias -d mcias_contracts_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MCIAS_ENVIRONMENT: development
      MCIAS_DATABASE_URL: postgresql+psycopg://mcias:synthetic_ci_only@127.0.0.1:5432/mcias_contracts_e2e
      MCIAS_E2E_DATABASE_URL: postgresql+psycopg://mcias:synthetic_ci_only@127.0.0.1:5432/mcias_contracts_e2e
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://mcias:synthetic_ci_only@127.0.0.1:5432/mcias_contracts_e2e
      MCIAS_BOOTSTRAP_TOKEN: synthetic_contracts_ci_only
      MCIAS_MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MCIAS_STORAGE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MCIAS_STORAGE_DIR: /tmp/mcias-contracts-e2e-store
      MCIAS_ENABLE_UI_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing app and Chromium
        run: |
          python -m pip install -e '.[test,browser]'
          python -m playwright install --with-deps chromium
      - name: Migrate test-only database
        run: alembic upgrade head
      - name: Launch existing FastAPI
        run: |
          uvicorn mcias.app:app --host 127.0.0.1 --port 8000 > /tmp/mcias-contracts-app.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "FastAPI did not start"; tail -60 /tmp/mcias-contracts-app.log; exit 1
      - name: Strict browser and PostgreSQL acceptance
        run: python scripts/check_contracts_acceptance.py
      - name: Save synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-acceptance-evidence
          path: |
            .e2e-output/contracts-acceptance/
          retention-days: 14
