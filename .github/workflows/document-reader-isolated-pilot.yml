name: MCIAS Document Reader Isolated Pilot
on:
  push:
    branches: [feat/mcias-document-reader-isolated-pilot]
    paths:
      - scripts/document_reader_isolated_pilot.py
      - .github/workflows/document-reader-isolated-pilot.yml
      - docs/DG-001_DOCUMENT_READER_PILOT_AR.md
  workflow_dispatch:
jobs:
  synthetic-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7' 'reportlab>=4.4.9,<5' 'Pillow>=11,<13'
      - run: python scripts/document_reader_isolated_pilot.py --out reader-pilot-results
      - name: Verify evidence files, review behavior and baseline
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('reader-pilot-results')
          d=json.loads((p/'baseline_results.json').read_text())
          assert len(d['measurements'])==6
          assert all(x['recall']==1 for x in d['measurements'] if x['mode']=='text_pdf')
          scanned=[x for x in d['measurements'] if x['mode']=='image_only_pdf']
          assert len(scanned)==1 and scanned[0]['review_required']
          assert (p/'ground_truth.json').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: document-reader-isolated-pilot
          path: reader-pilot-results/
          retention-days: 30
