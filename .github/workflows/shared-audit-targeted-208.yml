name: Shared Audit Targeted 208 Resolution
on:
  pull_request:
    paths:
      - scripts/resolve_remaining_208.py
      - .github/workflows/shared-audit-targeted-208.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcias-shared-audit-writer-phase1
          fetch-depth: 0
      - name: Resolve only existing 208 rows with pinned source
        run: python scripts/resolve_remaining_208.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-audit-targeted-208
          path: |
            docs/shared_audit_semantic_evidence/semantic_match_resolution.csv
            docs/shared_audit_semantic_evidence/semantic_closure_summary.json
            docs/shared_audit_semantic_evidence/targeted_208_resolution.md
      - name: Save evidence-only changes on PR29
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shared_audit_semantic_evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(audit): update previously unresolved semantic evidence"
          git push origin HEAD:refs/heads/feat/mcias-shared-audit-writer-phase1
