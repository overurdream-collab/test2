name: MCIAS G1 + G2 checks
on:
  push:
    branches: [main, feat/g1-foundation, feat/g2-ingestion]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q mcias tests
      - run: python -m pytest -q
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e .
      - run: pip-audit

  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcias_ci
          POSTGRES_PASSWORD: ci_only_not_for_production
          POSTGRES_DB: mcias_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcias_ci -d mcias_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCIAS_TEST_DATABASE_URL: postgresql+psycopg://mcias_ci:ci_only_not_for_production@localhost:5432/mcias_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_postgres_integration.py tests/test_restore_drill.py tests/test_rule_immutability_postgres.py tests/test_g2_ingestion.py tests/test_g2_reader.py tests/test_g2_security.py
