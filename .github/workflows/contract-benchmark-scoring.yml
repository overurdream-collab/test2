name: Contract benchmark Decimal scoring

on:
  pull_request:
    branches:
      - feat/temporal-reference-inputs-and-four-outcomes
    paths:
      - 'scripts/contract_benchmark_scoring.py'
      - 'scripts/contract_ai_benchmark.py'
      - 'tests/test_contract_benchmark_scoring.py'
      - '.github/workflows/contract-benchmark-scoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install 'pytest>=8,<9'
      - name: Verify Decimal equality and strict tariff identity without model
        run: python -m pytest -q --noconftest tests/test_contract_benchmark_scoring.py
