[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcias"
version = "0.1.0"
description = "MCIAS on-premises foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","alembic>=1.13,<2","pydantic-settings>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10","httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcias*"]
