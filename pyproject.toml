[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcias"
version = "0.1.0"
description = "MCIAS on-premises foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","alembic>=1.13,<2","pydantic-settings>=2.5,<3", "cryptography>=50.0.0,<51", "openpyxl>=3.1,<4", "pypdf>=5,<7", "Pillow>=13.0.0,<14", "PyMuPDF>=1.26,<2", "reportlab>=4.4.9,<5", "arabic-reshaper>=3.0,<4", "python-bidi>=0.6,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10","httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcias*"]

[tool.setuptools.package-data]
"mcias.seed" = ["data/*.json"]
mcias = ["web_g7/*.html", "web_g7/*.css", "web_g7/*.js", "web_g8/*.html", "web_g8/*.css", "web_g8/*.js", "web_workspace/*.html", "web_workspace/*.css", "web_workspace/*.js", "web_workspace/*.json", "web_workspace/icons/*.svg", "web_workspace/fonts/*"]
