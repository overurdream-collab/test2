# G9 on-prem TLS termination prototype. Certificates must be locally supplied.
# NOT A PRODUCTION-APPROVED DEPLOYMENT. Pin reviewed image digests before release.
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/mcias/tls.crt;
    ssl_certificate_key /etc/mcias/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_timeout 5m;
    ssl_prefer_server_ciphers off;

    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        proxy_read_timeout 60s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
    }
}
