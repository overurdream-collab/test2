# G9 on-prem engineering harness — localhost-only TLS exposure.
# Operator must provide deployment-private files and separate on-prem PostgreSQL.
# Do not label this production-approved without all signed G0-G9 acceptance evidence.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ./private/runtime.env
        required: true
    environment:
      MCIAS_ENVIRONMENT: production
      MCIAS_AUTHORIZATION_REGISTRY: /run/mcias/authorization-registry.json
    user: "1900:1900"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1024m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - ./private/authorization-registry.json:/run/mcias/authorization-registry.json:ro
      - ./private/encrypted-sources:/var/lib/mcias/sources:rw
    expose:
      - "8000"
    networks: [backend]
    restart: unless-stopped

  tls:
    # Replace this mutable development tag with an approved registry digest.
    image: nginx:stable-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./private/tls.crt:/etc/mcias/tls.crt:ro
      - ./private/tls.key:/etc/mcias/tls.key:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev
      - /var/run:rw,nosuid,nodev
      - /tmp:rw,nosuid,nodev,noexec
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    internal: true
